# PawKnits Android: build the APK and upload it to Sauce Labs storage (EU data center).
# The test pipeline (project pytest-appium-demo) will be triggered when this pipeline finishes.

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md          # changing only the README doesn't rebuild the app

# How to upload the APK to Sauce Labs storage. Pick it when you queue a run ("Run pipeline" > Parameters);
# automatic (CI) runs use the default. All three upload the same file under the same name.
parameters:
  - name: uploadMethod
    displayName: Upload APK with
    type: string
    default: saucectl-docker
    values:
      - api                # curl + Sauce Labs REST API
      - saucectl-docker    # saucectl from the official saucelabs/saucectl Docker image
      - saucectl-npm       # saucectl installed with npm

pool:
  vmImage: ubuntu-latest

variables:
  - group: sauce-labs
  - name: APK_PATH
    value: app/build/outputs/apk/debug/PawKnits.apk
  - name: SAUCECTL_VERSION     # pin it so a new saucectl release can't change the build unexpectedly
    value: 0.216.3

steps:
  - script: |
      export JAVA_HOME=$(JAVA_HOME_17_X64)
      ./gradlew assembleDebug --no-daemon
    displayName: Build debug APK (Java 17)

  # Option 1: REST API with curl.
  - ${{ if eq(parameters.uploadMethod, 'api') }}:
    - script: |
        curl --fail-with-body -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" -X POST \
          "https://api.eu-central-1.saucelabs.com/v1/storage/upload" \
          -F "payload=@$(APK_PATH)" \
          -F "name=PawKnits.apk" \
          -F "description=Azure build $(Build.BuildNumber) from commit $(Build.SourceVersion)"
      displayName: Upload APK to Sauce Labs storage (EU) - REST API
      env:
        SAUCE_USERNAME: $(SAUCE_USERNAME)
        SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)

  # Option 2: saucectl in its official Docker image (Docker is preinstalled on Microsoft-hosted
  # Ubuntu agents). The image has no entrypoint; saucectl is at /usr/local/bin/saucectl.
  # The storage name is the file name (PawKnits.apk), which is what the tests look for.
  # Unlike the API, saucectl skips the upload if an identical file (same checksum) is already
  # in storage; add --force to always upload.
  - ${{ if eq(parameters.uploadMethod, 'saucectl-docker') }}:
    - script: |
        docker run --rm \
          -e SAUCE_USERNAME -e SAUCE_ACCESS_KEY \
          -v "$(Build.SourcesDirectory):/src" -w /src \
          saucelabs/saucectl:v$(SAUCECTL_VERSION) \
          saucectl storage upload "$(APK_PATH)" \
            --region eu-central-1 \
            --description "Azure build $(Build.BuildNumber) from commit $(Build.SourceVersion)" \
            --disable-usage-metrics
      displayName: Upload APK to Sauce Labs storage (EU) - saucectl (Docker)
      env:
        SAUCE_USERNAME: $(SAUCE_USERNAME)
        SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)

  # Option 3: saucectl installed from npm (no Docker needed; Node.js is preinstalled on the agent).
  - ${{ if eq(parameters.uploadMethod, 'saucectl-npm') }}:
    - script: |
        npm install -g saucectl@$(SAUCECTL_VERSION)
        saucectl storage upload "$(APK_PATH)" \
          --region eu-central-1 \
          --description "Azure build $(Build.BuildNumber) from commit $(Build.SourceVersion)" \
          --disable-usage-metrics
      displayName: Upload APK to Sauce Labs storage (EU) - saucectl (npm)
      env:
        SAUCE_USERNAME: $(SAUCE_USERNAME)
        SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(APK_PATH)
      artifact: apk
    displayName: Publish APK as pipeline artifact
